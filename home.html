<!DOCTYPE html>
<html lang="en" x-data="{ showMore: false }" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 h-full">

  <!-- Top Bar -->
  <header class="bg-white shadow-sm py-3 px-6 flex items-center justify-between fixed w-full top-0 z-30">
    <div class="text-lg font-semibold text-gray-700">My Dashboard</div>
    <div class="flex items-center space-x-3">
      <span class="text-gray-700 hidden sm:block">John Doe</span>
      <img src="https://i.pravatar.cc/40?img=3" alt="User Avatar" class="w-10 h-10 rounded-full border" />
    </div>
  </header>

  <!-- Sidebar (desktop only) -->
  <aside class="hidden md:flex md:flex-col w-64 bg-white shadow-lg h-screen fixed top-16 z-10">
    <nav class="flex flex-col space-y-2 p-4">
      <a href="#" class="text-gray-700 hover:bg-gray-200 p-2 rounded">Dashboard</a>
      <a href="#" class="text-gray-700 hover:bg-gray-200 p-2 rounded">Users</a>
      <a href="#" class="text-gray-700 hover:bg-gray-200 p-2 rounded">Reports</a>
      <a href="#" class="text-gray-700 hover:bg-gray-200 p-2 rounded">Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="p-6 pt-24 md:pl-64">
    <h1 class="text-2xl font-semibold mb-4">Welcome to the Dashboard</h1>
    <p>This is the main content area.</p>
  </main>

  <!-- Bottom Navigation (mobile/tablet only) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white shadow-t border-t border-gray-200 md:hidden z-40">
    <div class="flex justify-around items-center h-14">
      <a href="#" class="flex flex-col items-center text-sm text-gray-600 hover:text-blue-600">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 12l2-2m0 0l7-7 7 7m-9 2v8m4-8h4a2 2 0 012 2v6a2 2 0 01-2 2h-4"></path>
        </svg>
        Dashboard
      </a>
      <a href="#" class="flex flex-col items-center text-sm text-gray-600 hover:text-blue-600">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 20h5v-2a4 4 0 00-4-4h-1"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M3 20h6v-2a4 4 0 00-4-4H3z"></path>
        </svg>
        Users
      </a>
      <div class="relative" x-data="{ open: false }">
        <button @click="open = !open" class="flex flex-col items-center text-sm text-gray-600 hover:text-blue-600 focus:outline-none">
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 6h.01M12 12h.01M12 18h.01"></path>
          </svg>
          More
        </button>
        <div x-show="open" @click.outside="open = false" class="absolute bottom-0 left-0 transform -translate-x-1/2 bg-white border rounded-lg shadow-lg w-32 text-sm z-50">
          <a href="#" class="block px-4 py-2 hover:bg-gray-100">Reports</a>
          <a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
