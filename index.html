<!DOCTYPE html>
<html lang="en" x-data="dashboard()" x-init="init()" class="min-h-screen bg-gray-50 text-gray-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.12.0/cdn.min.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

<!-- Sidebar + Main -->
<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="bg-white w-64 border-r hidden lg:block">
        <div class="h-full flex flex-col">
            <div class="px-6 py-4 text-lg font-semibold border-b">AdminHub</div>
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <template x-for="item in navItems" :key="item.id">
                    <a href="#"
                       :class="activeTab === item.id ? 'bg-indigo-100 text-indigo-600 font-semibold' : 'text-gray-600 hover:bg-indigo-50 hover:text-indigo-600'"
                       class="flex items-center px-3 py-2 rounded transition"
                       @click.prevent="activeTab = item.id">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2"
                             :d="item.icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"></svg>
                        <span x-text="item.label"></span>
                    </a>
                </template>
            </nav>
        </div>
    </aside>

    <!-- Content Area -->
    <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-white shadow px-4 py-3 flex items-center justify-between lg:justify-end">
            <div class="lg:hidden">
                <button @click="isSidebarOpen = !isSidebarOpen">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
            <div class="space-x-4">
                <button>
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1"/>
                    </svg>
                </button>
                <span class="text-sm font-medium text-gray-700">Admin</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-6">
            <div x-show="activeTab === 'dashboard'" class="space-y-4">
                <h1 class="text-2xl font-bold">Dashboard</h1>
                <div class="bg-white shadow p-4 rounded">Welcome to the dashboard.</div>
            </div>
            <div x-show="activeTab === 'analytics'" class="space-y-4">
                <h1 class="text-2xl font-bold">Analytics</h1>
                <div class="bg-white shadow p-4 rounded">Analytics content goes here.</div>
            </div>
            <div x-show="activeTab === 'projects'" class="space-y-4">
                <h1 class="text-2xl font-bold">Projects</h1>
                <div class="bg-white shadow p-4 rounded">List of projects.</div>
            </div>
            <div x-show="activeTab === 'customers'" class="space-y-4">
                <h1 class="text-2xl font-bold">Customers</h1>
                <div class="bg-white shadow p-4 rounded">Manage your customers here.</div>
            </div>
            <div x-show="activeTab === 'orders'" class="space-y-4">
                <h1 class="text-2xl font-bold">Orders</h1>
                <div class="bg-white shadow p-4 rounded">View and track orders.</div>
            </div>
            <div x-show="activeTab === 'reports'" class="space-y-4">
                <h1 class="text-2xl font-bold">Reports</h1>
                <div class="bg-white shadow p-4 rounded">Reports content.</div>
            </div>
            <div x-show="activeTab === 'settings'" class="space-y-4">
                <h1 class="text-2xl font-bold">Settings</h1>
                <div class="bg-white shadow p-4 rounded">Change application settings.</div>
            </div>
        </main>
    </div>
</div>

<script>
function dashboard() {
    return {
        activeTab: 'dashboard',
        isSidebarOpen: false,
        navItems: [
            { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
            { id: 'analytics', label: 'Analytics', icon: 'M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' },
            { id: 'projects', label: 'Projects', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01' },
            { id: 'customers', label: 'Customers', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' },
            { id: 'orders', label: 'Orders', icon: 'M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z' },
            { id: 'reports', label: 'Reports', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
            { id: 'settings', label: 'Settings', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' },
        ],
        init() {
            window.addEventListener('resize', () => {
                this.isSidebarOpen = window.innerWidth >= 1024;
            });
        }
    };
}
</script>
</body>
</html>
